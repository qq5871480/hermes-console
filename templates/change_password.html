{% extends "base.html" %}
{% block title %}修改密码{% endblock %}
{% block body %}
<div style="max-width:420px;margin:60px auto">
<div class="card">
<h2>{{ '首次登录：必须修改初始密码' if forced else '修改密码' }}</h2>
<form method="post">
<p>原密码<input name="old" type="password" required></p>
<p>新密码（≥8位，不能与初始密码相同）<input name="new1" type="password" required minlength="8"></p>
<p>确认新密码<input name="new2" type="password" required minlength="8"></p>
<p><button class="btn" style="width:100%">确认修改</button></p>
</form>
</div>
</div>
{% endblock %}
